# Thank-you and order status page block: "You earned N entries in <giveaway>" for the order.
api_version = "2026-07"

[[extensions]]
name = "Giveaway entries (thank-you and order status)"
handle = "giveaway-thank-you"
type = "ui_extension"
uid = "b476f053-18e2-3ea2-a18d-157ba2b44d884f05fde2"

[[extensions.targeting]]
module = "./src/ThankYou.jsx"
target = "purchase.thank-you.block.render"

[[extensions.targeting]]
module = "./src/OrderStatus.jsx"
target = "customer-account.order-status.block.render"

[extensions.capabilities]
# Calls the app's /api/order-entries endpoint with a session token.
network_access = true
